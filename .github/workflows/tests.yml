name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.4'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pdo_sqlite, sqlite3, xml
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: >-
          composer update --with=orchestra/testbench:${{ matrix.testbench }}
          --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
